[package]
# `amalgam` is taken on crates.io, so the published crate is `amalgam-cache`.
# The library is still imported as `use amalgam::...` (see `[lib]` below).
name = "amalgam-cache"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "An async Rust hybrid cache with fail-safe, per-key stampede protection, distributed invalidation and observable background work."
license = "MIT"
repository = "https://github.com/ZoonTronLabs/amalgam"
homepage = "https://github.com/ZoonTronLabs/amalgam"
documentation = "https://docs.rs/amalgam-cache"
readme = "README.md"
keywords = ["cache", "caching", "fusioncache", "stampede", "failsafe"]
categories = ["caching", "asynchronous"]
# Keep the published crate lean: ship source + docs, not large binary art or infra.
exclude = [
    "/assets/*.png", "/.github", "/docker-compose.yml", "/prometheus.yml",
    "/AGENTS.md", "/CLAUDE.md", "/GEMINI.md", "/.agents", "/.codex",
    "/docs/engineering", "/docs/spec-fix-all-audit.md", "/docs/audit-repair-matrix.json",
]

[lib]
name = "amalgam"

[dependencies]
async-trait = "0.1.89"
dashmap = "6.2.1"
fastrand = "2.4.1"
# Security floors retain safe resolution for downstream applications with old locks.
event-listener = "5.4.2"
h2 = { version = "0.4.16", optional = true }
anyhow = { version = "1.0.103", optional = true }
metrics = { version = "0.24.6", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["raw-entry"] }
parking_lot = "0.12.5"
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
postcard = { version = "1.1.3", optional = true, default-features = false, features = ["use-std"] }
redis = { version = "1.2.4", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
rmp-serde = { version = "1.3.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"], optional = true }

[features]
default = []
redis = ["dep:redis"]
messagepack = ["dep:rmp-serde"]
metrics = ["dep:metrics"]
opentelemetry = [
    "dep:h2",
    "dep:anyhow",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
postcard = ["dep:postcard"]
full = ["redis", "messagepack", "postcard", "metrics", "opentelemetry"]

[dev-dependencies]
metrics-exporter-prometheus = "0.18.3"
tokio = { version = "1.52.3", features = ["test-util"] }

[package.metadata.cargo-machete]
# Constraints intentionally protect transitive dependencies; code uses their callers.
ignored = ["event-listener", "h2", "anyhow"]
