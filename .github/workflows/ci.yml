name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_baseline:
        description: Optional full commit SHA for same-runner Rust diagnostics
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, lints and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  tests:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.88.0, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Default feature tests
        run: cargo test --locked
      - name: All feature tests
        run: cargo test --locked --all-features

  features:
    name: Individual features / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: No features and each optional integration
        shell: bash
        run: |
          cargo test --locked --all-targets --no-default-features
          for feature in redis messagepack postcard metrics opentelemetry; do
            cargo test --locked --all-targets --no-default-features --features "$feature"
          done
      - name: Minimum compiler lints
        if: matrix.toolchain == '1.88.0'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  redis:
    name: Live Redis protocols / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AMALGAM_REDIS_URL: redis://127.0.0.1:6379/
      AMALGAM_REQUIRE_REDIS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Required Redis integration tests
        run: cargo test --locked --all-features

  package:
    name: Packaged consumers / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Build the distributable and fresh / old-lock consumers
        run: .github/scripts/check-package.sh

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings


  loom:
    name: Actual ReaderSlots / Loom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Model the actual admission, guards and parking
        run: python3 .github/scripts/check-reader-slots-loom.py

  safety:
    name: ReaderSlots / ${{ matrix.tool }}
    strategy:
      fail-fast: false
      matrix:
        tool: [Miri, TSan]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Prepare Miri
        if: matrix.tool == 'Miri'
        run: cargo miri setup
      - name: Check real guard borrowing and colliding threads
        if: matrix.tool == 'Miri'
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..4
        run: cargo miri test --locked --lib reader_slots::safety_contract -- --test-threads=1
      - name: Instrument all Rust code and standard library for races
        if: matrix.tool == 'TSan'
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
        run: |
          cargo test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib reader_slots:: -- --test-threads=1

  release_regression:
    name: No regression against published 0.3.1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Counterbalanced public workloads against the registry package
        run: python3 benches/check-release-regression.py --output /tmp/amalgam-release-regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-regression-report
          path: /tmp/amalgam-release-regression
          retention-days: 7

  scaling:
    name: FusionCache comparison (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/amalgam-build-shared
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.88.0'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compare read and factory-retrieval APIs
        continue-on-error: true
        run: |
          amalgam_scaling_status=0
          python3 benches/run-scaling.py --api read --pairs 3 --gate all --output /tmp/amalgam-scaling/read || amalgam_scaling_status=1
          python3 benches/run-scaling.py --api get-or-set --pairs 3 --gate all --output /tmp/amalgam-scaling/get-or-set || amalgam_scaling_status=1
          exit "$amalgam_scaling_status"
      - name: Optional same-runner before/after diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic_baseline != ''
        env:
          AMALGAM_DIAGNOSTIC_BASELINE: ${{ inputs.diagnostic_baseline }}
        run: |
          [[ "$AMALGAM_DIAGNOSTIC_BASELINE" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$AMALGAM_DIAGNOSTIC_BASELINE"
          python3 benches/run-before-after.py --baseline "$AMALGAM_DIAGNOSTIC_BASELINE" --output /tmp/amalgam-before-after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic_baseline != ''
        with:
          name: before-after-report
          path: |
            /tmp/amalgam-before-after/report.json
            /tmp/amalgam-before-after/*.csv
            /tmp/amalgam-before-after/*.stderr
          retention-days: 7
      - name: Optional native CPU diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic_baseline != ''
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y linux-tools-generic
          python3 benches/run-native-profile.py --reports /tmp/amalgam-before-after --output /tmp/amalgam-profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnostic_baseline != ''
        with:
          name: native-profile
          path: |
            /tmp/amalgam-profile/report.json
            /tmp/amalgam-profile/*.txt
            /tmp/amalgam-profile/*.csv
            /tmp/amalgam-profile/*.stderr
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scaling-report
          path: |
            /tmp/amalgam-scaling/*/report.json
            /tmp/amalgam-scaling/*/ready-costs.csv
            /tmp/amalgam-scaling/*/pair-*.csv
            /tmp/amalgam-scaling/*/pair-*.stderr
          retention-days: 7

  ci:
    name: ci
    if: always()
    needs: [quality, tests, features, redis, package, security, loom, safety, release_regression]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          failed = [name for name, state in json.loads(os.environ['RESULTS']).items() if state['result'] != 'success']
          if failed:
              sys.exit('Failed or skipped gates: ' + ', '.join(failed))
          PY
